<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Register</title>

<link href=
"https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

background-image:url('/images/travelbg1.jpg');
background-size:cover;
background-position:center;
background-attachment:fixed;

}

.container{

width:500px;

margin-top:80px;

background:rgba(255,255,194,0.8);

padding:30px;

border-radius:20px;

}

</style>

</head>

<body>

<div class="container">

<h2 class="text-center">

Create Account

</h2>

<form action="/saveUser"
method="post">

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>


<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Phone Number</label>

<input
type="text"
name="phoneNumber"
class="form-control"
required
placeholder="Enter phone number">

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>


<button
class="btn btn-success w-100">

Register

</button>

</form>

<br>

<div class="text-center">

Already have account?

<a href="/login">

Login

</a>

</div>

</div>

</body>

</html>
