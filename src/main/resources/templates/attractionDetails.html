<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Attraction Details</title>

<link href=
"https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
    background:#003566 ;
}

.container{
background:#f289b2 ;
padding:30px;
margin-top:50px;
margin-bottom:50px;
border-radius:20px;
}

img{
width:100%;
height:350px;
object-fit:cover;
border-radius:15px;
}

</style>

</head>

<body>

<div class="container">

<h1 th:text="${attraction.attractionName}"></h1>

<img th:src="${attraction.imageUrl}"
alt="Attraction image unavailable">

<br><br>

<h4>
Location:
<span th:text="${attraction.location}"></span>
</h4>

<h4>Description</h4>

<p th:text="${attraction.description}"></p>

<a th:if="${packageId != null}"
   th:href="@{'/package/' + ${packageId}}"
   class="btn"
   style="background:black;color:white;">
    Back
</a>

<a th:if="${packageId == null}"
   href="/attractions"
   class="btn"
   style="background:black;color:white;">
    Back
</a>
</div>

</body>

</html>
