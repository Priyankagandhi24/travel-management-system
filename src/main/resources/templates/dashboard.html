<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

```
<title>Admin Dashboard</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet">

<style>

    body{
        background:#003566;
        min-height:100vh;
    }

    .overlay{
background:rgba(0,0,0,0.45);
min-height:100vh;
padding:30px;
}

.navbar{
    background:rgba(0,0,0,0.35);
    backdrop-filter:blur(10px);
    padding:15px 25px;
    margin-bottom:30px;
}

.logo{
    font-size:38px;
    font-weight:bold;
    color:white;
}

    .dashboard-title{
        color:white;
        font-size:45px;
        font-weight:bold;
        text-align:center;
        margin-top:30px;
        margin-bottom:40px;
    }

    .card{
        background:#FFC8DD;
        border:none;
        border-radius:20px;
        padding:25px;
        text-align:center;
        box-shadow:0 8px 20px rgba(0,0,0,0.25);
        transition:0.3s;
        height:100%;
    }

    .card:hover{
        transform:translateY(-8px);
    }

    .card h3{
        color:#003566;
        font-weight:bold;
    }

    .card h2{
        color:#003566;
        font-size:42px;
        font-weight:bold;
        margin-top:10px;
    }

    .action-btn{
        border-radius:15px;
        font-size:18px;
        font-weight:bold;
        padding:12px;
        box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }

    .quick-actions{
        margin-top:50px;
    }

</style>
```

</head>

<body>

<div class="container-fluid p-4">

```
<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}">
</div>

<h1 class="dashboard-title">
    Travel Management Admin Dashboard
</h1>

<div class="container">

    <div class="row g-4 justify-content-center">

        <div class="col-md-4">

            <div class="card">

                <h3>Total Packages</h3>

                <h2 th:text="${packageCount}">
                </h2>

                <a href="/packages"
                   class="btn btn-primary mt-3">

                    View Packages

                </a>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card">

                <h3>Total Attractions</h3>

                <h2 th:text="${attractionCount}">
                </h2>

                <a href="/attractions"
                   class="btn btn-primary mt-3">

                    View Attractions

                </a>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card">

                <h3>Total Users</h3>

                <h2 th:text="${userCount}">
                </h2>

                <a href="/admin/users"
                   class="btn btn-primary mt-3">

                    View Users

                </a>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card">

                <h3>Total Bookings</h3>

                <h2 th:text="${bookingCount}">
                </h2>

                <a href="/admin/bookings"
                   class="btn btn-primary mt-3">

                    View Bookings

                </a>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card">

                <h3>Home Page</h3>

                <p>
                    Visit the main website.
                </p>

                <a href="/"
                   class="btn btn-primary mt-3">

                    Go Home

                </a>

            </div>

        </div>

        <div class="col-md-4">

    <div class="card">

        <h3>Total Revenue</h3>

        <h2>
            ₹
            <span th:text="${revenue}"></span>
        </h2>

    </div>

</div>

    </div>

    <div class="row justify-content-center quick-actions">

        <div class="col-md-3">

            <a href="/admin/add"
               class="btn btn-success action-btn w-100">

                Add Package

            </a>

        </div>

        <div class="col-md-3">

            <a href="/admin/addAttraction"
               class="btn btn-success action-btn w-100">

                Add Attraction

            </a>

        </div>

    </div>

</div>


</div>

</body>

</html>
