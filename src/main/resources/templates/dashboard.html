<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Admin Dashboard</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

background-image:url('/images/travelbg1.jpg');

background-size:cover;

}

.container{

margin-top:50px;

}

.card{

margin:20px;

text-align:center;

padding:20px;

}

</style>

</head>

<body>

    <div class="container">

<h1 class="text-center text-white mb-5">

Admin Dashboard

</h1>

<div class="row justify-content-center">

<div class="col-md-4">

<div class="card">

<h3>Total Packages</h3>

<h2 th:text="${packageCount}">
</h2>

<a href="/packages"
class="btn btn-primary mt-3">

View Packages

</a>

</div>

</div>

<div class="col-md-4">

<div class="card">

<h3>Total Attractions</h3>

<h2 th:text="${attractionCount}">
</h2>

<a href="/attractions"
class="btn btn-success mt-3">

View Attractions

</a>

</div>

</div>

<div class="col-md-4">

<div class="card">

<h3>Total Users</h3>

<h2 th:text="${userCount}">
</h2>

<a href="/admin/users"
class="btn btn-dark mt-3">

View Users

</a>

</div>

</div>

<div class="col-md-4">

<div class="card">

<h3>Total Bookings</h3>

<h2 th:text="${bookingCount}">
</h2>

<a href="/admin/bookings"
class="btn btn-info mt-3">

View Bookings

</a>

</div>

</div>

<div class="col-md-4">

<div class="card">

<h3>Total Revenue</h3>

<h2>

₹
<span th:text="${revenue}">
</span>

</h2>

</div>

</div>

</div>


<div class="row justify-content-center mt-5">

<div class="col-md-3">

<a href="/admin/add"
class="btn btn-warning w-100 p-3">

Add Package

</a>

</div>

<div class="col-md-3">

<a href="/admin/addAttraction"
class="btn btn-success w-100 p-3">

Add Attraction

</a>

</div>

</div>

</div>

</body>

</html>
