<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>My Bookings</title>

<link href=
"https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
    background:#003566 ;
}

.container{

margin-top:50px;

background:#FFC8DD ;

padding:30px;

border-radius:20px;

}

</style>

</head>

<body>

<div class="container">

<h2 class="mb-4">

My Bookings

</h2>

<table class="table table-bordered">

<tr>

<th>
Booking ID
</th>

<th>
Package ID
</th>

<th>
People
</th>

<th>
Amount
</th>

<th>Status</th>

<th>Action</th>

</tr>

<tr
th:each=
"b:${bookings}">

<td
th:text=
"${b.bookingId}">
</td>

<td
th:text=
"${b.packageId}">
</td>

<td
th:text=
"${b.numberOfPeople}">
</td>

<td>

₹
<span
th:text=
"${b.totalAmount}">
</span>

</td>

<td>

    <span th:if="${b.status == 'Booked'}"
          class="badge bg-warning text-dark">
        Booked
    </span>

    <span th:if="${b.status == 'Coming Soon'}"
          class="badge bg-success">
        Coming Soon
    </span>

    <span th:if="${b.status == 'Ongoing'}"
          class="badge bg-dark">
        Ongoing
    </span>

    <span th:if="${b.status == 'Completed'}"
          class="badge bg-dark">
        Completed
    </span>

    <span th:if="${b.status == 'Cancelled'}"
          class="badge bg-danger">
        Cancelled
    </span>

</td>

<td>

<a th:if="${b.status == 'Booked' || b.status == 'Coming Soon'}"
   th:href="@{'/cancelBooking/' + ${b.bookingId}}"
   class="btn btn-danger btn-sm">

    Cancel

</a>

<span
th:if="${b.status == 'CANCELLED'}"
class="badge bg-secondary">

Already Cancelled

</span>

</td>

</tr>

</table>
<div class="text-center mt-4">

    <a href="/"
       class="btn btn-dark btn-lg">

        ← Back to Home

    </a>

</div>

</div>

</body>

</html>
