<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Package Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
    background:#003566 ;
}

.container{
background:#FFC8DD ;
padding:30px;
margin-top:50px;
margin-bottom:50px;
}

.package-img{

width:100%;

height:350px;

object-fit:cover;

border-radius:15px;

margin-bottom:20px;

}

h1{

font-weight:bold;

margin-bottom:20px;

}

.info-box{

background:white;

padding:15px;

border-radius:12px;

margin-bottom:15px;

}

.navbar{
    background:rgba(0,0,0,0.35);
    backdrop-filter:blur(10px);
    padding:15px 25px;
    margin-bottom:30px;
}

.logo{
    font-size:38px;
    font-weight:bold;
    color:white;
}

.attraction-link{

font-size:18px;

text-decoration:none;

font-weight:bold;

color:#0d6efd;

}

.attraction-link:hover{

color:#084298;

}

</style>

</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}">
</div>

<div class="container">

<img class="package-img"
th:src="${package.imageUrl}"
alt="Travel image unavailable">

<h1 th:text="${package.packageName}">
</h1>

<hr>

<div class="info-box">

<h4>
📍 Destination :
<span th:text="${package.destination}">
</span>
</h4>

<h4>
🕒 Duration :
<span th:text="${package.duration}">
</span> days
</h4>

<h4>
💰 Price :
₹ <span th:text="${package.price}">
</span>
</h4>

<h4>
🎟 Available Seats :
<span th:text="${package.availableSeats}">
</span>
</h4>

<h4>
📅 Start Date :
<span th:text="${package.startDateTime}">
</span>
</h4>

</div>

<div
th:if="${param.noseats}"
class="alert alert-danger">

Not enough seats available.

</div>

<div
th:if="${package.availableSeats <= 0}"
class="alert alert-danger">

This package is Sold Out.

</div>

<h4>Description</h4>

<div class="info-box">

<p th:text="${package.description}">
</p>

</div>

<a href="/packages"
   class="btn"
   style="background:black;color:white;">
    Back
</a>

<div
th:if="${package.availableSeats > 0}"
style="display:inline;">

<a th:href="@{'/book/' + ${package.packageId}}"
class="btn btn-success">

Book Now

</a>

</div>

<br><br>

<h3>

Attractions Included

</h3>

<ul class="list-group">

<li
class="list-group-item"
th:each="a : ${attractions}">

<a th:href="@{'/attraction/' + ${a.attractionId} + '?packageId=' + ${package.packageId}}"
   class="attraction-link">

<span th:text="${a.attractionName}"></span>

</a>

</li>

</ul>

</div>

</body>

</html>
