<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Tour Package</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

body{
    background:#003566 ;
}

.container{
background:#FFC8DD ;
    padding:30px;
    border-radius:15px;
}

</style>
</head>

<body>

<div class="container mt-4">

    <h2 class="mb-4">Add Tour Package</h2>

    <form action="/admin/save" method="post">

        <div class="mb-3">
            <label>Package Name</label>
            <input type="text"
                   class="form-control"
                   name="packageName"
                   required>
        </div>

        <div class="mb-3">
            <label>Destination</label>
            <input type="text"
                   class="form-control"
                   name="destination"
                   required>
        </div>

        <div class="mb-3">
            <label>Duration (Days)</label>
            <input type="number"
                   class="form-control"
                   name="duration">
        </div>

        <div class="mb-3">
            <label>Price</label>
            <input type="number"
                   class="form-control"
                   name="price"
                   required>
        </div>


        <div class="mb-3">
            <label>Available Seats</label>
            <input type="number" class="form-control"
                name="availableSeats" required>
        </div>

        <div class="mb-3">
            <label>Start Date & Time</label>
            <input type="datetime-local"
                   class="form-control"
                   name="startDateTime">
        </div>


        <div class="mb-3">
            <label>Image URL</label>
            <input type="text"
                   class="form-control"
                   name="imageUrl"
                   placeholder="Paste image URL">
        </div>

        <div class="mb-3">
            <label>Description</label>

            <textarea class="form-control"
                      rows="4"
                      name="description">
            </textarea>
        </div>

        <div class="mb-3">
            <label>Select Attractions</label>
            <div th:each="a : ${attractions}">
                <input type="checkbox"
                        name="selectedAttractions"
                        th:value="${a.attractionId}">
                <span th:text="${a.attractionId}"></span>
                -
                <span th:text="${a.attractionName}"></span>
                (<span th:text="${a.location}"></span>)

                <br>
            </div>
        </div>

        <button type="submit"
                class="btn btn-primary">

            Add Package

        </button>

    </form>

</div>

</body>
</html>
