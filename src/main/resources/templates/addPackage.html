<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Add Tour Package</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
      rel="stylesheet" />
    <style>

        body{
            background:#003566;
        }

        .container{
            background:#f289b2;
            padding:30px;
            border-radius:15px;
            max-width:900px;
            margin-top:30px;
            margin-bottom:30px;
        }

        .attraction-container{

            height:auto;

            border:2px solid #ced4da;

            border-radius:12px;

            padding:12px;

            background:white;

        }

        .attraction-item{

            padding:8px;

            margin-bottom:5px;

            border-radius:8px;

        }

        .attraction-item:hover{

            background:#f1f5f9;

        }

        /* Scrollbar */

        .attraction-container::-webkit-scrollbar{

            width:12px;

        }

        .attraction-container::-webkit-scrollbar-track{

            background:#e9ecef;

            border-radius:10px;

        }

        .attraction-container::-webkit-scrollbar-thumb{

            background:#0d6efd;

            border-radius:10px;

        }

        .attraction-container::-webkit-scrollbar-thumb:hover{

            background:#084298;

        }
.select2-container--default .select2-selection--multiple{

    min-height:50px;

    border-radius:10px;

    border:1px solid #ced4da;

}

.select2-container{

    width:100% !important;

}

.select2-selection__choice{

    font-size:14px;

}
    </style>

</head>

<body>

<div class="container">

    <h2 class="text-center mb-4">

        Add Tour Package

    </h2>

    <div th:if="${param.invalidDate}"
     class="text-danger fw-bold mb-3">

    Start date must be in the future.

</div>

    <form action="/admin/save"
          method="post">

        <div class="mb-3">

            <label>Package Name</label>

            <input type="text"
                   class="form-control"
                   name="packageName"
                   required>

        </div>

        <div class="mb-3">

            <label>Destination</label>

            <input type="text"
                   class="form-control"
                   name="destination"
                   required>

        </div>

        <div class="mb-3">

            <label>Duration (Days)</label>

            <input type="number"
                   class="form-control"
                   name="duration"
                   required>

        </div>

        <div class="mb-3">

            <label>Price</label>

            <input type="number"
                   class="form-control"
                   name="price"
                   required>

        </div>

        <div class="mb-3">

            <label>Available Seats</label>

            <input type="number"
                   class="form-control"
                   name="availableSeats"
                   required>

        </div>

        <div class="mb-3">

            <label>Start Date & Time</label>

            <input type="datetime-local"
       class="form-control"
       name="startDateTime"
       id="startDateTime"
       required>

        </div>

        <div class="mb-3">

            <label>Image URL</label>

            <input type="text"
                   class="form-control"
                   name="imageUrl"
                   placeholder="Paste image URL">

        </div>

        <div class="mb-3">

            <label>Description</label>

            <textarea class="form-control"
                      rows="4"
                      name="description"></textarea>

        </div>
<div class="mb-3">

    <label class="fw-bold">Filter By Destination</label>

    <select id="locationFilter" class="form-control mb-3">

        <option value="">All Destinations</option>

        <option th:each="loc : ${locations}"
                th:value="${loc}"
                th:text="${loc}">
        </option>

    </select>

</div>

<div class="mb-3">

    <input type="text"
           id="attractionSearch"
           class="form-control mb-3"
           placeholder="Search attractions...">

</div>

<div class="attraction-container">

    <div th:each="a : ${attractions}"
         class="attraction-item"
         th:data-location="${a.location}">

        <input type="checkbox"
               name="selectedAttractions"
               th:value="${a.attractionId}">

        <strong th:text="${a.attractionName}"></strong>

        <span class="text-muted">
            (<span th:text="${a.location}"></span>)
        </span>

    </div>

</div>

        <div class="d-flex gap-2">

    <a href="/packages"
       class="btn btn-dark w-50">

        ← Back to Packages

    </a>

    <button type="submit"
            class="btn btn-primary w-50">

        Add Package

    </button>

</div>

    </form>

</div>

<script>

let now = new Date();

now.setMinutes(
    now.getMinutes() -
    now.getTimezoneOffset()
);

document.getElementById("startDateTime")
.setAttribute(
    "min",
    now.toISOString().slice(0,16)
);

</script>
<script>

const searchInput =
    document.getElementById("attractionSearch");

const locationFilter =
    document.getElementById("locationFilter");

function filterAttractions(){

    const search =
        searchInput.value.toLowerCase();

    const location =
        locationFilter.value;

    document
        .querySelectorAll(".attraction-item")
        .forEach(item => {

            const text =
                item.innerText.toLowerCase();

            const itemLocation =
                item.dataset.location;

            const matchesSearch =
                text.includes(search);

            const matchesLocation =
                location === "" ||
                itemLocation === location;

            item.style.display =
                matchesSearch &&
                matchesLocation
                ? "block"
                : "none";

        });

}

searchInput.addEventListener(
    "keyup",
    filterAttractions
);

locationFilter.addEventListener(
    "change",
    filterAttractions
);

</script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</body>

</html>
