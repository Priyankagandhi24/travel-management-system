<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Users</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="container mt-5">

<h1 class="mb-4">

All Users

</h1>

<table class="table table-bordered table-striped">

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Role</th>

</tr>

<tr th:each="u : ${users}">

<td th:text="${u.id}">
</td>

<td th:text="${u.name}">
</td>

<td th:text="${u.email}">
</td>

<td th:text="${u.role}">
</td>

</tr>

</table>

</body>

</html>
