<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Users</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">
<style>
    body{
    background:#003566;
    min-height:100vh;
    padding:40px;
}

.table,
.table th,
.table td{
    border:1.5px solid black !important;
}

.page-box{
    background:#FFC8DD ;
    border-radius:20px;
    padding:30px;
    box-shadow:0 8px 25px rgba(0,0,0,0.25);
}

h1{
    text-align:center;
    color:black;
    font-weight:bold;
    margin-bottom:25px;
}

.table{
    overflow:hidden;
    border-radius:15px;
}

.table thead{
    background:#0077B6;
    color:white;
}

.table tbody tr:hover{
    background:#E3F2FD;
    transition:0.3s;
}

.back-btn{
    margin-bottom:20px;
}
</style>
</head>

<body>

<div class="container mt-4">

    <div class="page-box">

        <a href="/admin/dashboard"
           class="btn btn-dark back-btn">
            ← Back
        </a>

        <h1>All Users</h1>

        <table class="table table-bordered table-hover">

            <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="u : ${users}">

                <td th:text="${u.userId}"></td>

                <td th:text="${u.name}"></td>

                <td th:text="${u.email}"></td>

                <td>
                    <span class="badge bg-primary"
                          th:text="${u.role}">
                    </span>
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
