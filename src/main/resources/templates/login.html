<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Login</title>

<link href=
"https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
    background:#003566 ;
}

.container{
width:450px;
margin-top:100px;
background:#FFC8DD;
padding:30px;
border-radius:20px;
}

</style>

</head>

<body>

<div class="container">

<h2 class="text-center">

Login

</h2>

<form action="/checkLogin"
method="post">

<div class="mb-3">

<label>Email</label>

<input
class="form-control"
type="email"
name="email">

</div>

<div class="mb-3">

<label>Password</label>

<input
class="form-control"
type="password"
name="password">

</div>

<button
class="btn btn-success w-100">

Login

</button>

<br>

<div class="text-center">

Don't have account?

<a href="/register">

Register

</a>

</div>

</form>

</div>

<script th:if="${param.registered}">
alert("Registration successful");
</script>

<script th:if="${param.error}">
alert("Invalid email or password");
</script>

</body>
</html>
