<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Edit Attraction</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

background-image:url('/images/travelbg1.jpg');

background-size:cover;

}

.container{

margin-top:50px;

background:rgba(255,255,194,0.85);

padding:30px;

border-radius:20px;

}

</style>

</head>

<body>

<div class="container">

<h2 class="mb-4">

Edit Attraction

</h2>

<form
action="/admin/updateAttraction"
method="post">

<input type="hidden"
name="attractionId"
th:value="${attraction.attractionId}">

<div class="mb-3">

<label>
Attraction Name
</label>

<input type="text"
name="attractionName"
class="form-control"
th:value="${attraction.attractionName}"
required>

</div>

<div class="mb-3">

<label>
Location
</label>

<input type="text"
name="location"
class="form-control"
th:value="${attraction.location}"
required>

</div>

<div class="mb-3">

<label>
Description
</label>

<textarea
name="description"
class="form-control"
rows="5"
required
th:text="${attraction.description}">
</textarea>

</div>

<div class="mb-3">

<label>
Image URL
</label>

<input type="text"
name="imageUrl"
class="form-control"
th:value="${attraction.imageUrl}"
required>

</div>

<div class="d-flex gap-2">

<button
type="submit"
class="btn btn-success">

Update Attraction

</button>

<a th:href="@{'/admin/deleteAttraction/' + ${attraction.attractionId}}"
class="btn btn-danger"
onclick="return confirm('Delete this attraction?')">

Delete

</a>

<a href="/attractions"
class="btn btn-secondary">

Cancel

</a>

</div>

</form>

</div>

</body>

</html>
